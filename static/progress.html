<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Opcenter Designer · 设计进度</title><link rel="icon" href="/svg/opcenter.svg" type="image/svg+xml"><style>
        :root {
            color-scheme: light;
            --teal: #008577;
            --teal-hover: #006f64;
            --teal-soft: #e9f4f1;
            --text: #252b32;
            --secondary: #66707b;
            --muted: #818a94;
            --border: #e6e9ed;
            --surface: #fff;
            --background: #f7f8fa;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-synthesis: none;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { color: var(--text); background: var(--background); font-size: 14px; height: 100vh; height: 100dvh; overflow: hidden; }
        button, textarea, a { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; border: 0; background: none; color: inherit; }
        button:disabled { cursor: not-allowed; opacity: .45; }
        a { color: inherit; text-decoration: none; }
        button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
        [hidden] { display: none !important; }
        .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .app-shell { height: 100%; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
        .sidebar { background: #f0f2f4; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 16px 16px; min-height: 0; }
        .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
        .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--teal); display: grid; place-items: center; color: white; }
        .brand-mark .icon { width: 21px; height: 21px; }
        .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -.4px; }
        .brand-subtitle { color: var(--secondary); font-size: 11px; margin-top: 3px; letter-spacing: .8px; }
        .new-chat { display: flex; justify-content: center; align-items: center; gap: 8px; height: 38px; border: 1px solid #d8dde2; border-radius: 7px; background: white; margin: 29px 4px 24px; font-size: 13px; font-weight: 550; box-shadow: 0 1px 2px #18202a04; }
        .new-chat:hover { border-color: #aabbb6; background: #fcfefd; }
        .nav { display: grid; gap: 5px; }
        .nav-item { display: flex; gap: 11px; align-items: center; border-radius: 7px; padding: 10px 12px; font-size: 13px; text-align: left; color: var(--secondary); }
        .nav-item:hover { background: #e8ecef; }
        .nav-item.active { background: #e0eeea; color: #006f64; font-weight: 600; }
        .nav-item .icon { width: 17px; height: 17px; }
        .recent-heading { font-size: 11px; color: var(--muted); margin: 32px 12px 11px; display: flex; justify-content: space-between; }
        .session-list { overflow: auto; flex: 1; min-height: 0; }
        .session-item { display: block; width: 100%; padding: 10px 12px; font-size: 12px; text-align: left; border-radius: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--secondary); margin-bottom: 3px; }
        .session-item:hover { background: #e8ecef; }
        .session-item.active { background: #e6e9ed; color: var(--text); }
        .sidebar-empty { color: var(--muted); font-size: 12px; line-height: 1.8; padding: 6px 12px; }
        .sidebar-footer { border-top: 1px solid #dde2e7; padding: 17px 8px 0; margin-top: 20px; }
        .user-profile { display: flex; align-items: center; gap: 9px; }
        .avatar { height: 30px; width: 30px; background: #e0e5e9; border: 1px solid #d6dce1; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
        .user-name { font-size: 12px; font-weight: 550; }
        .user-caption { color: var(--muted); font-size: 10px; margin-top: 2px; }
        .siemens { font-size: 10px; letter-spacing: 1.6px; font-weight: 700; color: var(--teal); margin-left: auto; }
        .workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        .topbar { height: 66px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 32px; flex-shrink: 0; }
        .breadcrumbs { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
        .breadcrumbs .icon { width: 14px; height: 14px; color: #b1b8c0; }
        .breadcrumbs h1 { color: var(--text); font-size: 13px; font-weight: 550; }
        .mobile-menu, .sidebar-backdrop { display: none; }

        .session-list { scrollbar-width: thin; }
        .session-item { cursor: pointer; }
        .navigation-status { font-size: 12px; line-height: 1.8; padding: 8px 12px; color: var(--text-secondary); }
        @media (max-width: 1100px) { .log-sidebar { width: 260px; } .main-header, .trace-body { padding: 24px; } }
        @media (max-width: 900px) { .app-layout { flex-direction: column; } .log-sidebar { width: 100%; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--border); } }
        @media (max-width: 800px) {
            .app-shell { grid-template-columns: 190px minmax(0, 1fr); }
            .sidebar { padding-left: 10px; padding-right: 10px; }
            .siemens { display: none; }
            .topbar { padding: 0 22px; }
            .breadcrumbs > span, .breadcrumbs > .icon { display: none; }
        }
        @media (max-width: 600px) {
            .app-shell { display: block; }
            .workspace { height: 100%; }
            .sidebar { position: fixed; inset: 0 auto 0 0; width: 232px; z-index: 25; transform: translateX(-100%); transition: transform .2s; }
            body.sidebar-open .sidebar { transform: translateX(0); }
            body.sidebar-open .sidebar-backdrop { display: block; position: fixed; inset: 0; background: #1c28373b; z-index: 24; }
            .mobile-menu { display: grid; place-items: center; width: 30px; height: 30px; color: var(--secondary); }
            .topbar { padding: 0 16px; height: 58px; }
            .breadcrumbs { gap: 8px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }

        .progress-page { overflow-y:auto; flex:1; min-height:0; padding:36px 40px; }
        .progress-inner { max-width:1100px; margin:0 auto; }
        .page-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:26px; }
        .page-heading h2 { font-size:24px; font-weight:600; letter-spacing:-.6px; }
        .eyebrow { color:var(--teal); font-size:10px; letter-spacing:1.6px; margin-bottom:8px; font-weight:600; }
        .heading-actions { display:flex; align-items:center; gap:10px; }
        .task-select { max-width:280px; min-width:180px; border:1px solid var(--border); border-radius:8px; background:white; color:var(--text); padding:10px 12px; font:inherit; font-size:12px; }
        .button { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 14px; border:1px solid var(--border); border-radius:8px; background:white; font-size:12px; white-space:nowrap; }
        .button:hover { border-color:#b2c8c1; }
        .button.primary { background:var(--teal); color:white; border-color:var(--teal); }
        .button.primary:hover { background:var(--teal-hover); }
        .button.small { padding:7px 10px; font-size:11px; }
        .overview { background:white; border:1px solid var(--border); border-radius:14px; padding:22px 24px; margin-bottom:20px; }
        .overview-top { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; }
        .overview h3 { font-size:17px; font-weight:600; margin-bottom:10px; }
        .metadata { display:flex; flex-wrap:wrap; gap:8px 16px; color:var(--secondary); font-size:12px; line-height:1.6; }
        .counter { font-size:12px; color:var(--secondary); white-space:nowrap; padding-top:3px; }
        .counter b { color:var(--teal); font-weight:650; font-size:19px; }
        .segments { display:flex; gap:5px; margin-top:20px; }
        .segment { height:4px; flex:1; border-radius:4px; background:#edf0f2; }
        .segment.done,.segment.confirmed,.segment.skipped { background:var(--teal); }
        .segment.running { background:#93c7ba; }
        .workflow-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(280px,.85fr); gap:20px; align-items:start; }
        .panel { background:white; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
        .panel-heading { padding:17px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:600; }
        .panel-heading small { color:var(--muted); font-weight:400; font-size:10px; }
        .step-list { list-style:none; padding:8px; }
        .step-row { width:100%; display:flex; align-items:center; text-align:left; gap:12px; padding:12px 14px; border-radius:9px; min-height:53px; }
        .step-row:hover { background:#f7f9fa; }
        .step-row.selected { background:#eef6f3; }
        .step-number { width:25px; height:25px; display:grid; place-items:center; flex-shrink:0; border:1px solid #e0e5e9; color:var(--muted); font-size:10px; border-radius:50%; background:white; }
        .step-row.done .step-number,.step-row.confirmed .step-number,.step-row.skipped .step-number { background:var(--teal-soft); border-color:#d7e9e2; color:var(--teal); }
        .step-row.done .step-number::after,.step-row.confirmed .step-number::after { content:'✓'; font-size:13px; }
        .step-row.skipped .step-number::after { content:'–'; font-size:13px; }
        .step-row.done .step-number span,.step-row.confirmed .step-number span,.step-row.skipped .step-number span { display:none; }
        .step-row.current .step-number { border-color:var(--teal); color:var(--teal); }
        .step-name { flex:1; font-size:12px; }
        .step-row.current .step-name { font-weight:600; }
        .step-status { font-size:10px; color:var(--muted); white-space:nowrap; }
        .step-row.done .step-status,.step-row.confirmed .step-status { color:var(--teal); }
        .step-row.failed .step-status,.step-row.blocked .step-status { color:#b97539; }
        .step-row.running .step-status { color:var(--teal); }
        .step-row.running .step-number { animation:pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 50% { box-shadow:0 0 0 4px #00857712; } }
        .right-column { display:grid; gap:16px; }
        .action-content { padding:24px 22px; }
        .stage-kicker { color:var(--teal); font-size:10px; letter-spacing:.8px; margin-bottom:10px; }
        .action-content h3 { font-size:20px; font-weight:550; margin-bottom:12px; }
        .stage-detail { color:var(--secondary); font-size:12px; line-height:1.8; margin-bottom:18px; overflow-wrap:anywhere; }
        .action-buttons { display:flex; flex-wrap:wrap; gap:8px; }
        .runtime { margin-top:18px; padding:13px; background:#f4f8f6; border-radius:8px; font-size:11px; color:var(--secondary); line-height:1.9; }
        .runtime b { color:var(--teal); font-weight:600; }
        .runtime time { font-variant-numeric:tabular-nums; }
        .execution-summary { margin-top:18px; font-size:11px; color:var(--secondary); line-height:1.8; }
        .execution-summary div { display:flex; gap:12px; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); }
        .execution-summary b { color:var(--text); font-weight:500; overflow-wrap:anywhere; text-align:right; }
        .execution-summary p { margin-top:9px; color:#a96c31; }
        .confirm-note { font-size:12px; color:var(--secondary); line-height:1.8; margin-bottom:14px; }
        .wcf-input { width:100%; border:1px solid var(--border); border-radius:7px; padding:12px; font:inherit; font-size:13px; }
        .file-content { padding:18px 22px; }
        .file-label { font-size:10px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
        .file-path { display:block; font:11px/1.8 Consolas,monospace; color:var(--secondary); overflow-wrap:anywhere; padding:10px; background:#f7f8fa; border-radius:7px; margin-bottom:12px; }
        .file-note { font-size:11px; color:var(--muted); }
        .sync-state { font-size:11px; color:var(--secondary); display:flex; gap:7px; align-items:center; }
        .sync-state i { width:6px; height:6px; background:var(--teal); border-radius:50%; }
        .notice { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#263730; color:white; padding:11px 18px; border-radius:9px; max-width:80vw; font-size:12px; z-index:40; }
        .empty { text-align:center; padding:90px 20px; color:var(--secondary); }
        .empty h3 { font-size:20px; color:var(--text); margin-bottom:20px; font-weight:550; }
        dialog { margin:auto; padding:24px; border:1px solid var(--border); border-radius:12px; width:min(720px,calc(100% - 32px)); max-height:80vh; color:var(--text); }
        dialog::backdrop { background:#1c28373b; }
        dialog h3 { font-size:16px; font-weight:550; margin-bottom:18px; }
        .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
        .detail-table { border-collapse:collapse; width:100%; font-size:12px; }
        .detail-table th,.detail-table td { padding:10px 8px; text-align:left; border-bottom:1px solid var(--border); overflow-wrap:anywhere; }
        .detail-table th { color:var(--secondary); font-weight:500; }
        .requirements p { font-size:13px; white-space:pre-wrap; line-height:1.8; border-bottom:1px solid var(--border); padding:12px 0; }
        @media(max-width:1100px) { .progress-page { padding:28px; } .workflow-grid { grid-template-columns:minmax(0,1fr) minmax(260px,.8fr); } }
        @media(max-width:900px) { .page-heading { align-items:flex-start; flex-direction:column; gap:16px; } .workflow-grid { grid-template-columns:1fr; } .right-column { grid-row:1; } }
        @media(min-width:901px) and (max-height:800px) {
            .progress-page { padding:24px 32px; }
            .page-heading { margin-bottom:18px; }
            .overview { padding:18px 24px; margin-bottom:16px; }
            .segments { margin-top:14px; }
            .panel-heading { padding:14px 20px; }
            .step-list { padding:4px; }
            .step-row { padding:6px 14px; min-height:35px; }
            .step-number { width:23px; height:23px; }
        }
        @media(max-width:600px) { .progress-page { padding:24px 16px; } .page-heading h2 { font-size:22px; } .heading-actions { width:100%; flex-wrap:wrap; } .task-select { flex:1; min-width:0; } .overview { padding:18px; } .overview h3 { font-size:15px; } .overview-top { gap:12px; } .panel-heading { padding:15px 18px; } .action-content,.file-content { padding:18px; } }
        @media(prefers-reduced-motion:reduce) { * { animation:none !important; } }

<script>
        let navigationUsername = 'designer';
        const mobileLayout = matchMedia('(max-width: 600px)');
        function syncNavigation() {
            const open = document.body.classList.contains('sidebar-open');
            document.querySelector('.sidebar').inert = mobileLayout.matches && !open;
            document.querySelector('.workspace').inert = mobileLayout.matches && open;
            document.getElementById('mobileMenu').setAttribute('aria-expanded', String(open));
        }
        function closeNavigation() { document.body.classList.remove('sidebar-open'); syncNavigation(); }
        async function navigationJson(url, options) {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }
        async function loadNavigation() {
            const button = document.getElementById('newChatTopBtn'); button.disabled = true;
            try {
                const config = await navigationJson('/config'); navigationUsername = config.username || 'designer';
                document.getElementById('username').textContent = navigationUsername;
                document.getElementById('userAvatar').textContent = navigationUsername.slice(0, 1).toUpperCase();
                const data = await navigationJson(`/sessions/${encodeURIComponent(navigationUsername)}`);
                const sessions = (data.sessions || []).slice(0, 30);
                document.getElementById('sessionCount').textContent = sessions.length;
                const list = document.getElementById('sessionListUI'); list.replaceChildren();
                if (!sessions.length) { const empty = document.createElement('p'); empty.className = 'sidebar-empty'; empty.textContent = '还没有历史对话'; list.appendChild(empty); }
                sessions.forEach(session => {
                    const link = document.createElement('a'); link.className = 'session-item';
                    link.href = `/?session_id=${encodeURIComponent(session.id)}`;
                    link.textContent = session.title || '未命名设计'; link.title = link.textContent; list.appendChild(link);
                });
            } catch (error) {
                document.getElementById('sessionListUI').innerHTML = '<p class="sidebar-empty">记录加载失败，请刷新重试</p>';
            } finally { button.disabled = false; }
        }
        document.getElementById('newChatTopBtn').addEventListener('click', async event => {
            const button = event.currentTarget; button.disabled = true;
            try {
                const data = await navigationJson(`/sessions/${encodeURIComponent(navigationUsername)}/new`, {method:'POST'});
                location.assign(`/?session_id=${encodeURIComponent(data.session_id)}`);
            } catch (error) {
                const note = document.createElement('p'); note.className = 'navigation-status'; note.setAttribute('role', 'alert'); note.textContent = '创建对话失败，请稍后重试。';
                document.querySelector('.navigation-status')?.remove(); button.after(note); button.disabled = false;
            }
        });
        document.getElementById('mobileMenu').addEventListener('click', () => {
            document.body.classList.toggle('sidebar-open'); syncNavigation(); document.getElementById('newChatTopBtn').focus();
        });
        document.getElementById('sidebarBackdrop').addEventListener('click', () => { closeNavigation(); document.getElementById('mobileMenu').focus(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeNavigation(); document.getElementById('mobileMenu').focus(); } });
        mobileLayout.addEventListener('change', closeNavigation);
        syncNavigation();



        let currentSession = null, selectedStage = null, state = null, taskList = [], pollTimer, loading = false, submitting = false, noticeTimer, confirmationResolve;
        const statusNames = {pending:'未开始',done:'已完成',confirmed:'用户确认',skipped:'不需要',waiting:'待你操作',running:'执行中',failed:'未完成',blocked:'待核对'};
        const labels = {check:'核对结果',prepare:'准备 Designer 文件',sync:'同步文件',compile:'Compile',verify:'核验数据库',preflight:'检查发布',backup:'备份数据库',publish:'Update Database',wcf:'编译并生成 WCF'};
        const explanations = ['需求已记录','对象与字段已识别','检查来源与已有定义','保存对象与字段','核对文件与设计来源','在 Designer 中检查对象与字段','编译当前设计副本','检查通过后更新测试数据库','全量生成 WCF，核对设计对象与字段','在运行环境部署 WCF，完成后确认','核验数据库并完成业务验收'];
        function notice(message) { const node=document.getElementById('notice'); node.textContent=message; node.hidden=false; clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>node.hidden=true,6000); }
        async function api(url,options) { const response=await fetch(url,options); const data=await response.json(); if(!response.ok) throw Error(typeof data.detail==='string'?data.detail:`HTTP ${response.status}`); return data; }
        function duration(start) { const seconds=Math.max(0,Math.floor(Date.now()/1000-start)); return `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }
        function renderRuntime() {
            const node=document.getElementById('runtime'); node.replaceChildren(); node.hidden=!state?.active;
            if(!state?.active) return;
            const title=document.createElement('b'); title.textContent=`${labels[state.active.action]||'助手正在处理'} · `; node.appendChild(title);
            const time=document.createElement('time'); time.textContent=duration(state.active.started); node.appendChild(time);
            const line=document.createElement('div'); line.textContent=`最近更新 ${new Date(state.active.updated*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}`; node.appendChild(line);
            if(state.active.action) {const note=document.createElement('div'); note.textContent='可离开页面，操作会继续。'; node.appendChild(note);}
        }
        function button(label, handler, enabled=true, primary=false) {const node=document.createElement('button'); node.type='button'; node.className='button'+(primary?' primary':''); node.textContent=label; node.disabled=!enabled; node.onclick=handler; return node;}
        function render() {
            document.getElementById('taskSelect').disabled=submitting;document.getElementById('taskContent').hidden=false; document.getElementById('emptyView').hidden=true;
            document.getElementById('taskTitle').textContent=taskList.find(item=>item.id===currentSession)?.title||'设计任务';
            const meta=document.getElementById('taskMeta'); meta.replaceChildren();
            for(const text of state.package?[state.package.objects.join('、')||'元数据设计',`${state.package.field_count} 个字段`,`工作区 ${state.package.workspace}`]:['等待设计结果']) {const span=document.createElement('span'); span.textContent=text; meta.appendChild(span);}
            document.getElementById('completedCount').textContent=state.completed;
            document.getElementById('totalCount').textContent=state.stages.length;
            document.getElementById('conversationLink').href=`/?session_id=${encodeURIComponent(currentSession)}`;
            const segments=document.getElementById('segments'); const list=document.getElementById('stepList'); segments.replaceChildren(); list.replaceChildren();
            for(const stage of state.stages) {
                const segment=document.createElement('span'); segment.className=`segment ${stage.status}`; segment.title=`${stage.title}：${statusNames[stage.status]}`; segments.appendChild(segment);
                const row=button('',()=>{selectedStage=stage.number;render();}); row.className=`step-row ${stage.status}${stage.number===state.current?' current':''}${stage.number===(selectedStage||state.current)?' selected':''}`;
                row.setAttribute('aria-pressed',String(stage.number===(selectedStage||state.current)));
                row.innerHTML='<span class="step-number"><span></span></span><span class="step-name"></span><span class="step-status"></span>';
                row.querySelector('.step-number span').textContent=String(stage.number).padStart(2,'0'); row.querySelector('.step-name').textContent=stage.title;
                row.querySelector('.step-status').textContent=stage.status==='pending'&&stage.number===state.current?'待开始':statusNames[stage.status];
                const item=document.createElement('li'); item.appendChild(row); list.appendChild(item);
            }
            const stage=state.stages[(selectedStage||state.current)-1];
            document.getElementById('actionHeading').textContent=stage.number===state.current?'当前步骤':'步骤详情';
            document.getElementById('stageKicker').textContent=`STEP ${String(stage.number).padStart(2,'0')} / ${state.stages.length}`;
            document.getElementById('stageTitle').textContent=stage.title;
            document.getElementById('stageDetail').textContent=stage.detail||explanations[stage.number-1];
            const actions=document.getElementById('stageActions'); actions.replaceChildren();
            if(stage.number<=4) {actions.appendChild(button(stage.number<=3?'查看需求':'查看设计',()=>details(stage.number))); if(stage.status!=='done') {const link=document.createElement('a');link.className='button primary';link.textContent='继续设计';link.href=document.getElementById('conversationLink').href;actions.appendChild(link);}}
            stage.actions.forEach((item,index)=>actions.appendChild(button(item.label,()=>perform(item.id),item.enabled&&!submitting&&!state.active,index===0)));
            document.querySelectorAll('[data-execution-summary]').forEach(node=>node.remove());
            if(stage.number===8&&state.publication) {const summary=document.createElement('div');summary.className='execution-summary';summary.dataset.executionSummary='true';publicationSummary(summary,state.publication);actions.after(summary);}
            if((stage.number===9||stage.number===10)&&state.wcf) {const link=document.createElement('a');link.className='button';link.textContent='下载 WCF 程序集';link.href=`/api/progress/${encodeURIComponent(currentSession)}/wcf?username=${encodeURIComponent(navigationUsername)}&package_id=${state.package.id}`;actions.appendChild(link);}
            if(state.package&&stage.number===5) {const link=document.createElement('a');link.className='button';link.textContent='下载变更 XML';link.href=`/api/progress/${encodeURIComponent(currentSession)}/changes?username=${encodeURIComponent(navigationUsername)}&package_id=${state.package.id}`;actions.appendChild(link);}
            document.getElementById('syncBtn').disabled=!state.package?.review||!!state.active||submitting;
            renderFiles();renderRuntime();
            const latest=state.last_job;
            if(latest?.status==='failed'||latest?.status==='interrupted') {const note=document.createElement('p');note.className='stage-detail';note.style.marginTop='16px';note.textContent=latest.error;actions.after(note);note.dataset.jobError='true';}
            document.querySelectorAll('[data-job-error]').forEach((node,index,nodes)=>{if(index<nodes.length-1||!['failed','interrupted'].includes(latest?.status))node.remove();});
        }
        function renderFiles() {
            const area=document.getElementById('fileContent');area.replaceChildren();const pkg=state.package;
            if(!pkg){const note=document.createElement('p');note.className='file-note';note.textContent='等待设计生成';area.appendChild(note);return;}
            const review=pkg.review;
            for(const [label,path] of review?[['MDB',review.server_mdb],['SiteInfo',review.server_siteinfo]]:[['设计 MDB',pkg.mdb_file]]) {
                const heading=document.createElement('div');heading.className='file-label';heading.textContent=label;
                const copy=button('复制',()=>navigator.clipboard.writeText(path).then(()=>notice('路径已复制')).catch(()=>notice('请复制下方路径')));copy.className='file-note';heading.appendChild(copy);area.appendChild(heading);
                const code=document.createElement('code');code.className='file-path';code.textContent=path;area.appendChild(code);
            }
            const link=document.createElement('a');link.className='file-note';link.textContent='下载设计 MDB ↗';link.href=`/designer/results/${pkg.id}/mdb?username=${encodeURIComponent(navigationUsername)}&session_id=${encodeURIComponent(currentSession)}`;area.appendChild(link);
        }
        function details(number) {
            const content=document.getElementById('detailsContent');content.replaceChildren();content.className='';document.getElementById('detailsTitle').textContent=number===4?'设计结果':'设计需求';
            if(number===4&&state.design_rows?.length) {const table=document.createElement('table');table.className='detail-table';const head=table.createTHead().insertRow();for(const text of ['对象','字段','类型']){const th=document.createElement('th');th.textContent=text;head.appendChild(th);}const body=table.createTBody();for(const item of state.design_rows){const row=body.insertRow();for(const text of [item.owner,item.name,item.field_type])row.insertCell().textContent=text;}content.appendChild(table);}
            else {content.className='requirements';for(const text of state.requirements){const p=document.createElement('p');p.textContent=text;content.appendChild(p);}}
            document.getElementById('detailsDialog').showModal();
        }
        function summaryRow(container,label,value) {const row=document.createElement('div');const name=document.createElement('span');name.textContent=label;const text=document.createElement('b');text.textContent=value;row.append(name,text);container.appendChild(row);}
        function publicationSummary(container,info) {
            const fresh=created=>created&&Date.now()-Date.parse(created)>=0&&Date.now()-Date.parse(created)<=3600000;
            summaryRow(container,'服务器',info.target.server||'未配置');summaryRow(container,'数据库',info.target.database||'未配置');
            summaryRow(container,'发布检查',!info.plan?'未执行':!fresh(info.plan.created_utc)?'已过期':info.plan.ready_for_publish?'通过':'未通过');
            if(info.backup_required) {
                summaryRow(container,'数据库备份',info.backup?.status==='backup_verified'?(fresh(info.backup.created_utc)?'已校验 · 1 小时内有效':'已过期'):'未完成');
                if(info.backup?.created_utc)summaryRow(container,'备份时间',new Date(info.backup.created_utc).toLocaleString('zh-CN',{hour12:false}));
            } else summaryRow(container,'数据库备份','测试环境，无需备份');
            if(info.reason||info.plan?.blockers?.length){const note=document.createElement('p');note.textContent=info.plan?.blockers?.join('；')||info.reason;container.appendChild(note);}
        }
        function askConfirmation(action) {
            const titles={confirm_review:'确认已在 Designer 检查设计？',confirm_compile:'确认已在 Designer 编译？',confirm_publish:'确认已执行 Update Database？',confirm_wcf:'确认已生成并核对 WCF？',confirm_services:'确认 WCF 已部署并检查服务？',skip_services:'本次设计无需 WCF？',confirm_complete:'确认业务验收已完成？',backup:'备份目标数据库',publish:'执行 Update Database',wcf:'生成 WCF'};
            const content=document.getElementById('confirmContent');content.replaceChildren();document.getElementById('confirmTitle').textContent=titles[action];
            const note=document.createElement('p');note.className='confirm-note';note.textContent=action==='publish'?'更新以下数据库的设计元数据与存储结构。':action==='backup'?'创建独立备份并校验可读性。':action==='wcf'?'编译当前设计副本，全量生成 WCF，并核对所选对象的新字段。':'记录手动完成状态。';content.appendChild(note);
            if(action==='publish'||action==='backup') {const summary=document.createElement('div');summary.className='execution-summary';publicationSummary(summary,state.publication);content.appendChild(summary);}
            if(action==='publish') {const changes=state.publication.plan.changes||[];const names={create_cdo:'新增对象',add_field:'新增字段',create_field_type:'新增字段类型',patch:'修改属性',delete:'删除',change_field_type:'修改字段类型'};const table=document.createElement('table');table.className='detail-table';const head=table.createTHead().insertRow();for(const title of ['动作','对象','名称','内容']){const th=document.createElement('th');th.textContent=title;head.appendChild(th);}const body=table.createTBody();for(const change of changes){const row=body.insertRow();const description=[change.field_type,change.parent,...Object.entries(change.changes||change.properties||{}).map(([key,value])=>`${key}: ${typeof value==='object'?JSON.stringify(value):value}`)].filter(Boolean).join(' · ');for(const value of [names[change.action]||change.action,change.owner||change.kind||'',change.name||'',description])row.insertCell().textContent=value;}content.appendChild(table);}
            if(action==='wcf') {const label=document.createElement('label');label.className='confirm-note';label.textContent='验收对象（英文逗号分隔，最多 20 个）';label.htmlFor='wcfTypes';const input=document.createElement('input');input.id='wcfTypes';input.className='wcf-input';input.value=state.package.objects.join(', ');content.append(label,input);}
            document.getElementById('acceptConfirm').textContent=action==='publish'?'执行 Update Database':action==='backup'?'开始备份':action==='wcf'?'生成 WCF':'确认';
            document.getElementById('confirmDialog').showModal();return new Promise(resolve=>confirmationResolve=resolve);
        }
        function answerConfirmation(value) {document.getElementById('confirmDialog').close();confirmationResolve?.(value);confirmationResolve=null;}
        async function perform(action) {
            if(submitting||state?.active||!state?.package)return;
            const session=currentSession,packageId=state.package.id;
            const options=action==='publish'?{expected_plan_sha256:state.publication.plan.plan_sha256}:{};
            if(action==='publish'&&state.publication.backup_required)options.expected_backup_sha256=state.publication.backup.receipt_sha256;
            if((action.startsWith('confirm_')||['skip_services','backup','publish','wcf'].includes(action))&&!await askConfirmation(action))return;
            if(currentSession!==session||state?.package?.id!==packageId){notice('设计已更新，请刷新后重试');return;}
            if(action==='wcf')options.verify_types=document.getElementById('wcfTypes').value.split(/[,，]/).map(value=>value.trim()).filter(Boolean);
            submitting=true;render();
            try {await api('/api/progress/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:navigationUsername,session_id:session,package_id:packageId,action,...options})});selectedStage=null;await refresh();}
            catch(error){notice(error.message);}
            finally{submitting=false;if(state)render();}
        }
        async function refresh() {
            clearTimeout(pollTimer);if(loading||!currentSession)return;loading=true;
            try {const requested=currentSession;const next=await api(`/api/progress/${encodeURIComponent(requested)}?username=${encodeURIComponent(navigationUsername)}`);if(requested!==currentSession)return;if(state?.package?.id!==next.package?.id)selectedStage=null;state=next;render();document.getElementById('syncState').lastChild.textContent='自动更新';}
            catch(error){document.getElementById('syncState').lastChild.textContent='连接异常';notice(error.message);}
            finally{loading=false;pollTimer=setTimeout(refresh,state?.session_id!==currentSession?0:(document.hidden?15000:4000));}
        }
        async function initialize() {
            await loadNavigation();
            try {const data=await api(`/api/progress/tasks?username=${encodeURIComponent(navigationUsername)}`);taskList=data.tasks;const select=document.getElementById('taskSelect');select.replaceChildren();
                if(!taskList.length){select.add(new Option('暂无设计任务',''));document.getElementById('emptyView').hidden=false;document.getElementById('syncState').lastChild.textContent='已同步';return;}
                for(const item of taskList)select.add(new Option(item.title,item.id));const wanted=new URLSearchParams(location.search).get('session_id');currentSession=taskList.some(item=>item.id===wanted)?wanted:taskList[0].id;select.value=currentSession;select.disabled=false;await refresh();
            }catch(error){notice(error.message);document.getElementById('syncState').lastChild.textContent='连接异常';}
        }
        document.getElementById('taskSelect').onchange=event=>{currentSession=event.target.value;selectedStage=null;state=null;history.replaceState(null,'',`/progress?session_id=${encodeURIComponent(currentSession)}`);refresh();};
        document.getElementById('refreshBtn').onclick=()=>refresh();document.getElementById('syncBtn').onclick=()=>perform('sync');
        document.getElementById('cancelConfirm').onclick=()=>answerConfirmation(false);document.getElementById('acceptConfirm').onclick=()=>answerConfirmation(true);
        document.getElementById('confirmDialog').addEventListener('cancel',event=>{event.preventDefault();answerConfirmation(false);});
        document.getElementById('closeDetails').onclick=()=>document.getElementById('detailsDialog').close();
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});setInterval(renderRuntime,1000);initialize();
</script></body></html>
