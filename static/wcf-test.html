<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Opcenter Designer · WCF 接口测试</title><link rel="icon" href="/svg/opcenter.svg" type="image/svg+xml"><link rel="stylesheet" href="/testing.css?v=20261025-1"><script src="/wcf-simple.js?v=20261025-1" defer></script><link rel="stylesheet" href="/wcf-simple.css"><script src="/workspace-navigation.js?v=20261025-1" defer></script></head>
<body><div class="app-shell">
  <aside class="sidebar" aria-label="工作台导航">
    <a class="brand" href="/" aria-label="Opcenter Designer 首页"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#design"/></svg></span><div><div class="brand-name">Opcenter</div><div class="brand-subtitle">DESIGNER WORKSPACE</div></div></a>
    <button class="new-chat" id="newChatTopBtn" type="button"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#plus"/></svg>新建设计对话</button>
    <nav class="nav" aria-label="主要功能">
      <a class="nav-item" href="/"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#chat"/></svg>设计助手</a>
      <a class="nav-item" href="/clf"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#clf"/></svg>CLF 工作区</a>
      <a class="nav-item" href="/records"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#history"/></svg>设计记录</a>
      <a class="nav-item" href="/progress"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#progress"/></svg>设计进度</a>
      <a class="nav-item" href="/wcf-test" id="wcfNav"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#wcf"/></svg>WCF 接口测试</a>
      <a class="nav-item" href="/clf-test" id="clfNav"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#clf-test"/></svg>CLF 逻辑测试</a>
      <a class="nav-item" href="/logs"><svg class="icon" aria-hidden="true"><use href="/svg/navigation.svg#log"/></svg>运行日志</a>
    </nav>
    <div class="recent-heading"><span>最近对话</span><span id="sessionCount">—</span></div>
    <div class="session-list" id="sessionListUI"><p class="sidebar-empty">正在加载对话…</p></div>
    <div class="sidebar-footer"><div class="user-profile"><span class="avatar" id="userAvatar">D</span><div><div class="user-name" id="usernameLabel">designer</div><div class="user-caption">设计工作台</div></div><span class="siemens">SIEMENS</span></div></div>
  </aside>
  <main class="workspace"><header class="topbar"><span>测试与验收 / <span id="breadcrumb">WCF 接口测试</span></span><button class="button" id="historyToggle" aria-expanded="false">测试记录</button></header>
  <div class="page simple-page">
  <div class="page-heading"><div><h1>WCF 接口测试</h1><p>查询前 5 条数据，点击记录右侧的编辑修改内容。</p></div><div class="actions"><button class="button" id="refreshButton">刷新配置</button><a class="button" href="/wcf-test/settings">连接配置</a></div></div>
  <div id="notice" role="status" hidden></div>
  <div class="system-context"><span class="system-dot" aria-hidden="true"></span><span>使用系统默认环境与已保存的业务账号</span><span id="connection" class="muted">正在读取配置…</span></div>
  <section class="panel object-panel"><div class="object-controls"><label>测试对象<input id="objectSearch" placeholder="搜索对象，例如 Product 或产品" aria-label="搜索对象"></label><label>选择对象<select id="objectSelect" aria-label="测试对象"></select></label><button class="primary" id="queryButton" disabled>查询前 5 条</button></div><p id="serviceCaption" class="muted">选择对象后即可查询，无需填写对象名称。</p></section>
  <section class="panel result-panel"><div class="section-heading"><h2>查询结果</h2><span class="muted">最多 5 条</span></div><div id="result" aria-live="polite"><p class="empty-state">选择对象，点击“查询前 5 条”。</p></div></section>
  <section class="panel history-panel" id="historyPanel" hidden><h2>测试记录</h2><div id="historyList"></div></section>
  </div></main></div>
  <dialog id="editDialog" aria-labelledby="editTitle"><form id="editForm"><div class="dialog-heading"><div><h2 id="editTitle">编辑记录</h2><p id="editIdentity" class="muted"></p></div><button class="button" id="closeEditor" type="button" aria-label="关闭编辑">关闭</button></div><p id="editStatus" role="status"></p><div id="commonFields" class="form-grid"></div><details id="otherFieldsDetails"><summary>其他可编辑字段</summary><input id="fieldSearch" placeholder="搜索字段" aria-label="搜索字段"><div id="otherFields" class="form-grid"></div></details><div class="dialog-actions"><button class="button" id="cancelEdit" type="button">取消</button><button class="primary" id="saveButton" type="submit" disabled>保存修改</button></div></form></dialog>
  </body></html>
