<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Opcenter Designer · 功能测试</title><link rel="icon" href="/svg/opcenter.svg" type="image/svg+xml"><link rel="stylesheet" href="/testing.css"><script src="/wcf-simple.js" defer></script><link rel="stylesheet" href="/wcf-simple.css"></head>
<body><div class="app-shell">
  <aside class="sidebar"><div class="brand"><img src="/svg/opcenter.svg" alt="" width="32" height="32"><div>Opcenter Designer<small>设计工作台</small></div></div><nav class="nav" aria-label="工作台导航"><a class="nav-item" href="/">设计助手</a><a class="nav-item" href="/clf">CLF 逻辑助手</a><a class="nav-item" href="/records">设计记录</a><a class="nav-item" href="/progress">设计进度</a><a class="nav-item" href="/wcf-test" id="wcfNav">WCF 接口测试</a><a class="nav-item" href="/clf-test" id="clfNav">CLF 逻辑测试</a><a class="nav-item" href="/logs">运行日志</a></nav><div class="sidebar-footer"><strong id="usernameLabel">本机工作台</strong><small>测试结果保存在本机</small></div></aside>
  <main class="workspace"><header class="topbar"><span>测试与验收 / <span id="breadcrumb">WCF 接口测试</span></span><button class="button" id="historyToggle" aria-expanded="false">测试记录</button></header>
  <div class="page simple-page">
  <div class="page-heading"><div><h1>WCF 接口测试</h1><p>查询前 5 条数据，点击记录右侧的编辑修改内容。</p></div></div>
  <div id="notice" role="status" hidden></div>
  <div class="system-context"><span class="system-dot" aria-hidden="true"></span><span>使用系统默认环境与已保存的业务账号</span><span id="connection" class="muted">正在读取配置…</span></div>
  <section class="panel object-panel"><div class="object-controls"><label>测试对象<input id="objectSearch" placeholder="搜索对象，例如 Product 或产品" aria-label="搜索对象"></label><label>选择对象<select id="objectSelect" aria-label="测试对象"></select></label><button class="primary" id="queryButton" disabled>查询前 5 条</button></div><p id="serviceCaption" class="muted">选择对象后即可查询，无需填写对象名称。</p></section>
  <section class="panel result-panel"><div class="section-heading"><h2>查询结果</h2><span class="muted">最多 5 条</span></div><div id="result" aria-live="polite"><p class="empty-state">选择对象，点击“查询前 5 条”。</p></div></section>
  <section class="panel history-panel" id="historyPanel" hidden><h2>测试记录</h2><div id="historyList"></div></section>
  </div></main></div>
  <dialog id="editDialog" aria-labelledby="editTitle"><form id="editForm"><div class="dialog-heading"><div><h2 id="editTitle">编辑记录</h2><p id="editIdentity" class="muted"></p></div><button class="button" id="closeEditor" type="button" aria-label="关闭编辑">关闭</button></div><p id="editStatus" role="status"></p><div id="commonFields" class="form-grid"></div><details id="otherFieldsDetails"><summary>其他可编辑字段</summary><input id="fieldSearch" placeholder="搜索字段" aria-label="搜索字段"><div id="otherFields" class="form-grid"></div></details><div class="dialog-actions"><button class="button" id="cancelEdit" type="button">取消</button><button class="primary" id="saveButton" type="submit" disabled>保存修改</button></div></form></dialog>
  </body></html>
